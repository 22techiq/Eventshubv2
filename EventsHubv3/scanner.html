<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EventHub Gate Scanner</title><link rel="stylesheet" href="./styles.css"><style>
body{background:#101827;color:white}.scan-wrap{max-width:620px;margin:45px auto;padding:20px}.scan-card{background:#fff;color:var(--ink);border-radius:18px;padding:24px}.scan-card input{width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;margin:7px 0}.scan-result{padding:17px;border-radius:12px;margin-top:15px;background:#f0f1f6}.good{background:#e4faf3;color:#08785f}.bad{background:#fff0ef;color:#b42318}video{width:100%;border-radius:12px;background:#111;max-height:330px;object-fit:cover}.hidden{display:none}
</style></head><body><header class="topbar"><a class="brand" href="./index.html"><span class="brand-mark">E</span><span>EventHub <small>GATE VALIDATION</small></span></a><nav><a href="./admin.html">Admin</a></nav></header><main class="scan-wrap"><div class="scan-card"><span class="eyebrow">ADMIT ONE · VERIFY EVERY TICKET</span><h1>Gate scanner</h1><p class="muted">Sign in with an ADMIN or GATE staff account. Camera access requires HTTPS.</p><form id="loginForm" class="stack"><input name="email" type="email" placeholder="Staff email" required><input name="password" type="password" placeholder="Password" required><button class="btn btn-primary">Sign in</button></form><div id="scanner" class="hidden"><video id="video" playsinline></video><button id="startCamera" class="btn btn-primary">Start camera scanner</button><p class="muted">Or paste the QR token manually:</p><form id="manualForm" class="stack"><input name="qrToken" placeholder="EVENTHUB:... or QR token" required><button class="btn btn-outline">Verify ticket</button></form></div><div id="result"></div></div></main>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script><script src="./config.js"></script><script src="./api.js"></script><script src="./scanner.js"></script></body></html>
