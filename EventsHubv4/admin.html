<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EventHub Admin</title><link rel="stylesheet" href="./styles.css"><style>
body{background:#f5f6fb}.admin-wrap{max-width:1150px;margin:35px auto;padding:0 20px}.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:20px}.stat small{color:var(--muted)}.stat b{display:block;font-size:27px;margin-top:9px}.panel{margin-top:18px}.panel h2{font-size:19px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px}.form-grid textarea{grid-column:1/-1;min-height:90px}.wide{grid-column:1/-1}.event-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.hidden{display:none!important}@media(max-width:700px){.admin-grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.form-grid textarea,.wide{grid-column:auto}.admin-head{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body><header class="topbar"><a class="brand" href="./index.html"><span class="brand-mark">E</span><span>EventHub <small>ADMIN CONSOLE</small></span></a><nav><a href="./index.html">Public site</a><a href="./scanner.html">Gate scanner</a><button class="btn btn-outline" id="logoutBtn">Sign out</button></nav></header>
<main class="admin-wrap"><div id="loginPanel" class="panel" style="max-width:430px;margin:70px auto"><span class="eyebrow">SECURE ADMIN ACCESS</span><h2>Sign in to EventHub</h2><form id="loginForm" class="stack"><input name="email" type="email" placeholder="Admin email" required><input name="password" type="password" placeholder="Password" required><button class="btn btn-primary" id="signInBtn" type="submit"><span>Sign in</span></button></form><p id="loginStatus" class="form-status" role="status" aria-live="polite"></p><p id="loginError" class="form-error" role="alert" aria-live="assertive"></p></div>
<div id="dashboard" class="hidden"><div class="admin-head"><div><span class="eyebrow">CONTROL CENTER</span><h1>Event overview</h1><p class="muted" id="welcome"></p></div><a class="btn btn-primary" href="./scanner.html">Open gate scanner →</a></div>
<div class="admin-grid"><div class="stat"><small>Total events</small><b id="sEvents">0</b></div><div class="stat"><small>Published</small><b id="sPublished">0</b></div><div class="stat"><small>Tickets issued</small><b id="sTickets">0</b></div><div class="stat"><small>Confirmed revenue</small><b id="sRevenue">KSh 0</b></div></div>
<section class="panel"><h2>Create an event</h2><form id="eventForm" class="form-grid"><input name="name" placeholder="Event name" required><select name="category"><option>Music</option><option>Conference</option><option>Business</option><option>Sports</option><option>Festival</option><option>Other</option></select><input name="venue" placeholder="Venue" required><input name="startsAt" type="datetime-local" required><input name="endsAt" type="datetime-local"><select name="status"><option value="DRAFT">Save as draft</option><option value="PUBLISHED">Publish event</option></select><input name="bannerUrl" placeholder="Banner image URL (optional)"><textarea name="description" placeholder="Event description"></textarea><button class="btn btn-primary wide">Create event</button></form><p id="eventMsg" class="muted"></p></section>
<section class="panel"><h2>Add ticket category</h2><form id="typeForm" class="form-grid"><select name="eventId" id="eventSelect" required></select><input name="name" placeholder="e.g. VIP" required><input name="price" type="number" min="1" step="0.01" placeholder="Price (KES)" required><input name="quantity" type="number" min="1" placeholder="Quantity" required><button class="btn btn-primary wide">Add ticket type</button></form><p id="typeMsg" class="muted"></p></section>
<section class="panel"><h2>Events</h2><div id="eventList"></div></section></div></main>
<script src="./config.js"></script><script src="./api.js"></script><script src="./admin.js"></script></body></html>
